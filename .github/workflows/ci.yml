# Correctness CI: runs on every push to main and every pull
# request. Mirrors `task ci` locally, minus `test:scripts`
# (currently unimplemented). Action and tool pins follow
# RULES.md - bump per the latest-stable check.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test + vet + modverify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true

      - name: go mod verify
        # Supply-chain check: confirms go.sum matches downloaded
        # module zips. Cheap; runs first so an integrity break
        # fails the job before any compile work.
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: go test
        # Default ./... covers the public-API contract tests,
        # SerenityOS corpus runner (always-on; ships with the
        # repo), pathological-input regressions, and fuzz seeds.
        run: go test ./...

  test-race:
    name: test -race
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The race detector requires cgo. Default-on in
      # ubuntu-24.04 runners, set explicitly for resilience.
      CGO_ENABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true

      - name: go test -race
        run: go test -race ./...

  lint:
    name: lint + fmt:check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true

      - name: Install golangci-lint
        # Pinned to the same version `task tools` installs, so
        # CI and local agree byte-for-byte. Bump in Taskfile.yml
        # and here together.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.1

      - name: golangci-lint run
        run: golangci-lint run

      - name: golangci-lint fmt --diff
        # Non-destructive formatter check: exits non-zero if any
        # file would be rewritten by `task fmt`.
        run: golangci-lint fmt --diff

  vuln:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: govulncheck
        run: govulncheck ./...

  # Cross-compiling proves the code COMPILES for an architecture; it does not
  # prove it computes the right answer there. JBIG2 is decoded bit by bit,
  # and its symbol dictionaries are budgeted by multiplying a width by a height.
  #
  # s390x is BIG-ENDIAN and 386/arm are 32-bit, so between them these lanes
  # cover both assumptions a byte-stream reader can carry without knowing it.
  # poppler and pdfium test on none of the four 64-bit arches; 32-bit ARM they
  # do hold, and we did not.
  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, exec: "-exec=qemu-riscv64-static" }
          - { goarch: loong64, exec: "-exec=qemu-loongarch64-static" }
          - { goarch: ppc64le, exec: "-exec=qemu-ppc64le-static" }
          - { goarch: s390x,   exec: "-exec=qemu-s390x-static" }
          # 386 runs with NO emulator: a 386 ELF executes directly on the
          # x86-64 runner. That is not a convenience, it is a correctness
          # requirement. Measured on one commit of go-gfx/gfx, eight identical
          # lanes each:
          #
          #   under qemu-i386                    5 failures out of 8
          #   under qemu-i386, asyncpreemptoff=1 0 out of 8
          #   native on the same runner          0 out of 8
          #   under qemu-arm                     0 out of 8
          #
          # Each failure landed on a DIFFERENT input although the seed is
          # fixed, and the wrong value was a sign flip rather than a rounding
          # difference. qemu-i386 loses the guest's floating-point state across
          # the signal Go delivers for asynchronous preemption. Emulating 386
          # here would buy nothing and cost a lane that goes red at random.
          - { goarch: "386",   exec: "" }
          - { goarch: arm,     exec: "-exec=qemu-arm-static" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Test under qemu (${{ matrix.goarch }})
        run: GOARCH=${{ matrix.goarch }} go test ${{ matrix.exec }} ./...
